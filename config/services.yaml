# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    media_dir_relative: 'public/media'
    thumbnail_dir_relative: 'public/thumbnail'
    media_dir: "%kernel.project_dir%/%media_dir_relative%"
    thumbnail_dir: "%kernel.project_dir%/%thumbnail_dir_relative%"
    upload_allowed_extensions: ['jpg', 'jpeg', 'png', 'gif']
    thumbnail_sizes: ['240x180']

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $appUrl: '%env(APP_URL)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\MediaUploadService:
        arguments:
            $mediaDirRelative: '%media_dir_relative%'
            $thumbnailDirRelative: '%thumbnail_dir_relative%'
            $mediaDir: '%media_dir%'
            $thumbnailDir: '%thumbnail_dir%'
            $uploadAllowedExtensions: '%upload_allowed_extensions%'
            $thumbnailSizes: '%thumbnail_sizes%'

    App\Api\Search\VehicleConditionSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleTypeSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleFuelTypeSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleTransmissionSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleDoorCountSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleFirstRegistrationYearSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleSeatCountSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleEquipmentSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleExteriorColorSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleInteriorColorSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\VehicleHorsePowerSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\BrandSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\ModelSearchCriteriaHandler:
        tags: ['app.search_condition.handler']

    App\Api\Search\SearchCriteriaHandler:
        arguments:
            - !tagged_iterator app.search_condition.handler

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
